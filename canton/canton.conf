# canton/canton.conf
# RefCanton Multi-Participant Synchronizer and Node Topology
# Configured for Canton 3.4.11 / Daml 3

canton {
    parameters {
        manual-start = false
        non-standard-config = true
    }

    mediators {
        mediator1 {
            admin-api {
                address = "0.0.0.0"
                port = 5003
            }
        }
    }

    sequencers {
        sequencer1 {
            admin-api {
                address = "0.0.0.0"
                port = 5002
            }
            public-api {
                address = "0.0.0.0"
                port = 5001
            }
            sequencer {
                config {
                    storage {
                        type = "memory"
                    }
                }
                type = "reference"
            }
            storage {
                type = "memory"
            }
        }
    }

    participants {
        # Participant 1: Alice (Borrower)
        participant1 {
            admin-api {
                address = "0.0.0.0"
                port = 5012
            }
            ledger-api {
                address = "0.0.0.0"
                port = 5011
                user-management-service {
                    enabled = true
                }
            }
            http-ledger-api {
                address = "0.0.0.0"
                port = 5014
            }
            storage {
                type = "memory"
            }
        }

        # Participant 2: LegacyBank (Lender A)
        participant2 {
            admin-api {
                address = "0.0.0.0"
                port = 5022
            }
            ledger-api {
                address = "0.0.0.0"
                port = 5021
                user-management-service {
                    enabled = true
                }
            }
            http-ledger-api {
                address = "0.0.0.0"
                port = 5024
            }
            storage {
                type = "memory"
            }
        }

        # Participant 3: NeoCapital (Lender B)
        participant3 {
            admin-api {
                address = "0.0.0.0"
                port = 5032
            }
            ledger-api {
                address = "0.0.0.0"
                port = 5031
                user-management-service {
                    enabled = true
                }
            }
            http-ledger-api {
                address = "0.0.0.0"
                port = 5034
            }
            storage {
                type = "memory"
            }
        }
    }
}
