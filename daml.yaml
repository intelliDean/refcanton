# Ref Canton — Private Refinancing App
# DO NOT change the sdk-version mid-build. See DECISIONS.md D8.

sdk-version: 3.4.11
name: ref-canton
source: daml
version: 0.0.1

dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script

data-dependencies:
  # Splice token standard DARs (from cn-quickstart)
  - daml/dars/splice-api-token-metadata-v1-1.0.0.dar
  - daml/dars/splice-api-token-holding-v1-1.0.0.dar
  - daml/dars/splice-api-token-allocation-v1-1.0.0.dar
  - daml/dars/splice-api-token-allocation-request-v1-1.0.0.dar
  - daml/dars/splice-api-token-transfer-instruction-v1-1.0.0.dar
  - daml/dars/splice-api-token-allocation-instruction-v1-1.0.0.dar

build-options:
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
  - -Wno-upgrade-interfaces

# Test package (separate compilation unit)
# daml-test/ has its own daml.yaml that depends on this package's .dar
