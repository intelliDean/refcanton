# Ref Canton — Private Refinancing App
# DO NOT change the sdk-version mid-build. See DECISIONS.md D8.

sdk-version: 3.4.11
name: ref-canton
source: daml
version: 0.0.1

dependencies:
  - daml-prim
  - daml-stdlib
  - daml-script


build-options:
  - --ghc-option=-Wunused-binds
  - --ghc-option=-Wunused-matches
  - -Wno-upgrade-interfaces

# Test package (separate compilation unit)
