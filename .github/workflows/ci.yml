name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Build, Security & Integration Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install Daml SDK 3.4.11
        run: |
          curl -sSL https://get.daml.com/ | sh -s 3.4.11
          echo "$HOME/.daml/bin" >> $GITHUB_PATH

      - name: Verify Daml SDK Installation
        run: |
          daml version

      - name: Compile Daml Smart Contracts (.dar)
        run: |
          npm run daml:build

      - name: Run Daml Contract Test Suite (17 Integration & Regression Tests)
        run: |
          npm test

      - name: Install Backend Dependencies
        run: |
          npm run backend:install

      - name: Compile Backend TypeScript
        run: |
          npm run backend:build

      - name: Run Backend Security & Access Control Regression Tests
        run: |
          npm run backend:test

      - name: Start Canton & Backend Stack with Docker Compose
        run: |
          ./scripts/run_docker.sh

      - name: Execute End-to-End Refinancing API Test
        run: |
          ./scripts/test_live_api_closing.sh

      - name: Teardown Docker Compose
        if: always()
        run: |
          docker compose down
